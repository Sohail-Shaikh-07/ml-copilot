[project]
name = "ml-copilot"
version = "0.1.0"
description = "Focused ML engineering agent with safe tools, durable sessions, and eval-driven development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0,<0.122.0",
    "httpx>=0.28.0,<0.29.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "whoosh>=2.7.4,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "huggingface_hub>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.11.0,<0.12.0",
    "mypy>=1.10.0,<2.0.0",
    "types-requests>=2.31.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=3.0.0,<4.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "vulture>=2.10,<3.0",
    "radon>=6.0.0,<7.0.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.agent",
    "app.api",
    "app.evals",
    "app.storage",
    "app.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 60
