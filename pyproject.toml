[project]
name = "ml-copilot"
version = "0.1.0"
description = "Focused ML engineering agent with safe tools, durable sessions, and eval-driven development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.11.0,<0.12.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.agent",
    "app.api",
    "app.evals",
    "app.storage",
    "app.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
